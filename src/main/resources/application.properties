spring.application.name=spring-web

spring.quartz.auto-startup=true
spring.quartz.job-store-type=jdbc
spring.quartz.overwrite-existing-jobs=true
spring.quartz.jdbc.initialize-schema=always
spring.quartz.jdbc.schema=classpath:quartz-schema-postgresql.sql

# Scheduler identity ? AUTO gives each instance a unique ID (hostname + timestamp)
spring.quartz.properties.org.quartz.scheduler.instanceName=ClusteredQuartzScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# Thread pool ? increase if you have multiple concurrent jobs
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.threadPool.threadsInheritContextClassLoaderOfInitializingThread=true

# JDBC job store ? clustering enabled
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=true
# How often (ms) each instance checks in with the cluster ? lower = faster failover
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=10000
# Prevent two instances firing the same trigger simultaneously
spring.quartz.properties.org.quartz.jobStore.acquireTriggersWithinLock=true
# How long (ms) a trigger can be misfired before Quartz handles it
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000

spring.mongodb.host=localhost
spring.mongodb.port= 27017
spring.mongodb.database=pets

spring.threads.virtual.enabled=true

resilience4j.retry.instances.findPetByType.max-attempts=3
resilience4j.retry.instances.findPetByType.wait-duration=2s
resilience4j.retry.instances.findPetByType.enable-exponential-backoff=true
resilience4j.retry.instances.findPetByType.exponential-backoff-multiplier=2
resilience4j.retry.instances.findPetByType.retry-exceptions[0]=com.springweb.exception.PetNotFoundException

resilience4j.bulkhead.instances.findPetByType.max-concurrent-calls=1
resilience4j.bulkhead.instances.findPetByType.max-wait-duration=100ms


management.endpoints.web.exposure.include=health,metrics,beans,conditions,startup,quartz

spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=1s

# Enable Redis keyspace notifications for key expiry events
management.health.redis.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.datasource.url=jdbc:postgresql://localhost:5432/springweb
spring.datasource.username=springweb
spring.datasource.password=springweb123