apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-config
  namespace: my-pet-namespace
data:
  # PostgreSQL configuration (using external service)
  spring.database.url: "jdbc:postgresql://external-postgres:5432/springweb"
  spring.database.username: "springweb"
  spring.database.password: "springweb123"

  # MongoDB configuration (using external service)
  spring.mongodb.host: "external-mongodb"
  spring.mongodb.port: "27017"
  spring.mongodb.database: "pets"

  # Redis configuration (using external service)
  spring.data.redis.host: "external-redis"
  spring.data.redis.port: "6379"

