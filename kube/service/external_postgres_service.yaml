apiVersion: v1
kind: Service
metadata:
  name: external-postgres
  namespace: my-pet-namespace
spec:
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-postgres
  namespace: my-pet-namespace
  labels:
    kubernetes.io/service-name: external-postgres
    app: pets-web
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.5.15  # Rancher Desktop VM IP (where the postgres container publishes 5432)
ports:
  - protocol: TCP
    port: 5432
