apiVersion: v1
kind: Service
metadata:
  name: external-mongodb
  namespace: my-pet-namespace
spec:
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-mongodb
  namespace: my-pet-namespace
  labels:
    kubernetes.io/service-name: external-mongodb
    app: pets-web
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.5.2 # host.docker.internal (mongod runs on the Mac)
ports:
  - protocol: TCP
    port: 27017

