apiVersion: v1
kind: Service
metadata:
  name: external-mongodb
  namespace: spring-web
spec:
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-mongodb
  labels:
    kubernetes.io/service-name: external-mongodb
    app: spring-web
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.18.66 # Your local computer IP
ports:
  - protocol: TCP
    port: 27017

