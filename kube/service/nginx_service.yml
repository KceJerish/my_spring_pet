apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: spring-web
  labels:
    app: nginx
    type: frontend
spec:
  type: NodePort
  selector:
    app: nginx
    type: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
