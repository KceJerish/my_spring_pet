apiVersion: v1
kind: Service
metadata:
  name: spring-web-service
  namespace: spring-web
  labels:
    app: spring-web
    type: backend
spec:
  type: NodePort
  selector:
    app: spring-web
    type: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080