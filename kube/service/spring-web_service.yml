apiVersion: v1
kind: Service
metadata:
  name: pet-app-service
  namespace: my-pet-namespace
  labels:
    app: my-pet
    type: backend
spec:
  type: NodePort
  selector:
    app: my-pet
    type: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080