apiVersion: v1
kind: Service
metadata:
  name: external-redis
  namespace: my-pet-namespace
spec:
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-redis
  namespace: my-pet-namespace
  labels:
    kubernetes.io/service-name: external-redis
    app: spring-web
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.5.15  # Rancher Desktop VM IP (where the redis container publishes 6379)
ports:
  - protocol: TCP
    port: 6379

