apiVersion: v1
kind: Pod
metadata:
  name: pets-web
  labels:
    app: pets-web
    type: backend
spec:
  containers:
    - name: pets-app
      image: pets:0.1.1-SNAPSHOT
      imagePullPolicy: Never  # Use local image, don't pull from registry
      ports:
        - containerPort: 8080
      env:
        - name: spring.profiles.active
          value: "kubernetes"