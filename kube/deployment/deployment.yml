apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-app
  namespace: my-pet-namespace
  annotations:
    # Stakater Reloader does a rolling restart when pet-config changes (see kube/README.md)
    configmap.reloader.stakater.com/reload: "pet-config"
  labels:
    app: my-pet
    type: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-pet
      type: backend
  template:
    metadata:
      labels:
        app: my-pet
        type: backend
    spec:
      containers:
        - name: pet-app
          image: pets:0.1.3-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: spring.profiles.active
              value: "kubernetes"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/config/"
          volumeMounts:
            - name: pet-config-voume
              mountPath: /etc/config # Path inside the container
      volumes:
        - name: pet-config-voume
          configMap:
            name: pet-config