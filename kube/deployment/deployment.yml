apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-app
  namespace: my-pet-namespace
  labels:
    app: my-pet
    type: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-pet
      type: backend
  template:
    metadata:
      labels:
        app: my-pet
        type: backend
    spec:
      containers:
        - name: pet-app
          image: pets:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: spring.profiles.active
              value: "kubernetes"